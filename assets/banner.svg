<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abel Belei — Software Engineer, Togo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070C"/>
      <stop offset="0.55" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0E1A33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 150) scale(280)">
      <stop offset="0" stop-color="#3D7DFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#3D7DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentStroke" x1="760" y1="230" x2="1140" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D7DFF"/>
      <stop offset="1" stop-color="#9CCBFF"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9CCBFF"/>
      <stop offset="1" stop-color="#3D7DFF"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#3D7DFF" fill-opacity="0.14"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <style>
    .eyebrow{font:600 13px/1 'JetBrains Mono',Consolas,monospace;letter-spacing:3px;fill:#6FA0FF;}
    .name{font:800 54px/1 'Segoe UI',Helvetica,Arial,sans-serif;fill:#F5F7FA;letter-spacing:0.5px;}
    .role{font:500 20px/1 'Segoe UI',Helvetica,Arial,sans-serif;fill:#AEB9CF;}
    .chip-text{font:600 12px/1 'JetBrains Mono',Consolas,monospace;fill:#DCE4F5;}
    .caption{font:500 11px/1 'JetBrains Mono',Consolas,monospace;letter-spacing:2px;fill:#5A6A8C;}
    .kpi{font:700 15px/1 'JetBrains Mono',Consolas,monospace;fill:#F5F7FA;}
    .kpi-label{font:600 9px/1 'JetBrains Mono',Consolas,monospace;letter-spacing:1.5px;fill:#5A6A8C;}
    .cursor{fill:#3D7DFF;}

    /* ---- role ticker : one 12s loop, three 4s slots, no overlap ---- */
    @keyframes roleCycle{
      0%{opacity:0; transform:translateY(6px);}
      4%{opacity:1; transform:translateY(0);}
      29%{opacity:1; transform:translateY(0);}
      33%{opacity:0; transform:translateY(-6px);}
      100%{opacity:0;}
    }
    #role-1{ animation: roleCycle 12s ease-in-out infinite; animation-delay: 0s; }
    #role-2{ animation: roleCycle 12s ease-in-out infinite; animation-delay: 4s; }
    #role-3{ animation: roleCycle 12s ease-in-out infinite; animation-delay: 8s; }
    #role-1,#role-2,#role-3{ opacity:0; }

    /* ---- signature graphic : same 12s loop, same three slots ---- */
    @keyframes sigCycle{
      0%{opacity:0; transform:scale(0.97);}
      4%{opacity:1; transform:scale(1);}
      29%{opacity:1; transform:scale(1);}
      33%{opacity:0; transform:scale(0.97);}
      100%{opacity:0;}
    }
    .sig{ transform-origin: 950px 150px; }
    #sig-arc{    animation: sigCycle 12s ease-in-out infinite; animation-delay: 0s; }
    #sig-radial{ animation: sigCycle 12s ease-in-out infinite; animation-delay: 4s; }
    #sig-bars{   animation: sigCycle 12s ease-in-out infinite; animation-delay: 8s; }
    #sig-arc,#sig-radial,#sig-bars{ opacity:0; }

    @keyframes draw{ to { stroke-dashoffset: 0; } }
    @keyframes ringDraw{ to { stroke-dashoffset: 0; } }
    @keyframes pulse{ 0%,100%{ r:5; opacity:1;} 50%{ r:9; opacity:0.35;} }
    @keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
    @keyframes rise{ from{ transform: scaleY(0);} to{ transform: scaleY(1);} }

    .arcPath{ stroke-dasharray: 640; stroke-dashoffset: 640; animation: draw 2.2s ease-out forwards; }
    .ball{ animation: pulse 2.4s ease-in-out infinite; animation-delay: 2.2s; }
    .cursor{ animation: blink 1.1s steps(1) infinite; }
    .ring-outer{ stroke-dasharray: 440; stroke-dashoffset: 440; animation: ringDraw 1.8s ease-out forwards; animation-delay: 0.1s; }
    .ring-inner{ stroke-dasharray: 339; stroke-dashoffset: 339; animation: ringDraw 1.8s ease-out forwards; animation-delay: 0.4s; }
    .bar{ transform-box: fill-box; transform-origin: bottom; animation: rise 0.7s cubic-bezier(.2,.8,.2,1) both; }
    .bar1{ animation-delay: 0.05s; } .bar2{ animation-delay: 0.15s; } .bar3{ animation-delay: 0.25s; }
    .bar4{ animation-delay: 0.35s; } .bar5{ animation-delay: 0.45s; } .bar6{ animation-delay: 0.55s; }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>

    <!-- faint court key arc, constant backdrop -->
    <circle cx="1010" cy="150" r="230" stroke="#3D7DFF" stroke-opacity="0.10" stroke-width="1.5"/>
    <circle cx="1010" cy="150" r="150" stroke="#3D7DFF" stroke-opacity="0.08" stroke-width="1.5"/>

    <!-- left text block -->
    <text x="64" y="78" class="eyebrow">SOFTWARE ENGINEER · TOGO 🇹🇬</text>
    <text x="62" y="146" class="name">ABEL BELEI</text>

    <g>
      <text id="role-1" x="64" y="182" class="role">Full-Stack Developer — Java · Spring Boot · React</text>
      <text id="role-2" x="64" y="182" class="role">Building for the web, mobile &amp; the cloud</text>
      <text id="role-3" x="64" y="182" class="role">Learning DevOps, one deploy at a time</text>
    </g>

    <!-- tag chips -->
    <g transform="translate(64,208)">
      <g>
        <rect width="60" height="26" rx="13" fill="#101B33" stroke="#22314F"/>
        <text x="14" y="17" class="chip-text">Java</text>
      </g>
      <g transform="translate(68,0)">
        <rect width="112" height="26" rx="13" fill="#101B33" stroke="#22314F"/>
        <text x="14" y="17" class="chip-text">Spring Boot</text>
      </g>
      <g transform="translate(188,0)">
        <rect width="72" height="26" rx="13" fill="#101B33" stroke="#22314F"/>
        <text x="14" y="17" class="chip-text">React</text>
      </g>
      <g transform="translate(268,0)">
        <rect width="86" height="26" rx="13" fill="#101B33" stroke="#22314F"/>
        <text x="14" y="17" class="chip-text">DevOps</text>
      </g>
    </g>

    <!-- shared ground line + caption, works under all three signature states -->
    <line x1="760" y1="232" x2="1140" y2="232" stroke="#22314F" stroke-width="1"/>
    <text x="760" y="256" class="caption">BUILD · SHIP · SCALE</text>

    <!-- ================= SIGNATURE, state 1 : shot-arc → growth-line ================= -->
    <g id="sig-arc" class="sig">
      <path class="arcPath" d="M 760 232 C 840 232, 880 232, 920 190 C 955 154, 960 110, 1010 96 C 1055 84, 1090 92, 1122 70"
            stroke="url(#accentStroke)" stroke-width="3" stroke-linecap="round" fill="none"/>
      <circle class="ball" cx="1122" cy="70" r="5" fill="#9CCBFF"/>
      <rect x="1128" y="63" width="8" height="14" class="cursor"/>
    </g>

    <!-- ================= SIGNATURE, state 2 : circular / radial dashboard ================= -->
    <g id="sig-radial" class="sig">
      <circle cx="950" cy="150" r="70" stroke="#1A2740" stroke-width="10" fill="none"/>
      <circle class="ring-outer" cx="950" cy="150" r="70" stroke="url(#accentStroke)" stroke-width="10" fill="none"
              stroke-linecap="round" transform="rotate(-90 950 150)"/>
      <circle cx="950" cy="150" r="54" stroke="#141F38" stroke-width="8" fill="none"/>
      <circle class="ring-inner" cx="950" cy="150" r="54" stroke="#6FA0FF" stroke-width="8" fill="none"
              stroke-linecap="round" transform="rotate(-90 950 150)"/>
      <text x="950" y="146" text-anchor="middle" class="kpi">72%</text>
      <text x="950" y="162" text-anchor="middle" class="kpi-label">UPTIME</text>

      <g class="kpi-label" fill="#5A6A8C">
        <text x="1050" y="112" text-anchor="start">● JAVA / SPRING</text>
        <text x="1050" y="132" text-anchor="start" fill="#3D7DFF">● REACT</text>
        <text x="1050" y="152" text-anchor="start">● DEVOPS</text>
      </g>
    </g>

    <!-- ================= SIGNATURE, state 3 : bar / commit graph ================= -->
    <g id="sig-bars" class="sig">
      <g>
        <rect class="bar bar1" x="770" y="152" width="18" height="80" rx="3" fill="url(#barFill)" opacity="0.55"/>
        <rect class="bar bar2" x="808" y="122" width="18" height="110" rx="3" fill="url(#barFill)" opacity="0.7"/>
        <rect class="bar bar3" x="846" y="162" width="18" height="70" rx="3" fill="url(#barFill)" opacity="0.55"/>
        <rect class="bar bar4" x="884" y="96"  width="18" height="136" rx="3" fill="url(#barFill)" opacity="0.85"/>
        <rect class="bar bar5" x="922" y="132" width="18" height="100" rx="3" fill="url(#barFill)" opacity="0.7"/>
        <rect class="bar bar6" x="960" y="70"  width="18" height="162" rx="3" fill="url(#accentStroke)"/>
      </g>
      <g class="kpi-label" fill="#5A6A8C">
        <text x="1050" y="112" text-anchor="start">● COMMITS</text>
        <text x="1050" y="132" text-anchor="start" fill="#3D7DFF">● DEPLOYS</text>
        <text x="1050" y="152" text-anchor="start">● REVIEWS</text>
      </g>
    </g>
  </g>
</svg>
