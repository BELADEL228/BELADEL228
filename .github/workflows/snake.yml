name: Generate Snake Animation

# Builds an animated "snake" that eats through the contribution graph
# and publishes the SVGs to the `output` branch, which the README embeds.

on:
  schedule:
    - cron: "0 3 * * *"       # daily at 03:00 UTC
  workflow_dispatch: {}
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: BELADEL228
          outputs: |
            dist/snake-dark.svg?palette=github-dark
            dist/snake-light.svg?palette=github-light
            dist/snake.gif?color_snake=%233D7DFF&color_dots=%2321262d,%23112340,%231A2740,%23234A8C,%233D7DFF

      - name: Publish to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
