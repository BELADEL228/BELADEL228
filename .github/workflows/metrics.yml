name: Generate GitHub Metrics

# Renders a personal metrics panel (repos, languages, activity, habits)
# to assets/metrics.svg so it can be embedded directly in the README.

on:
  schedule:
    - cron: "0 4 * * *"       # daily at 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: BELADEL228
          filename: assets/metrics.svg
          committer_message: "chore(metrics): refresh dashboard [skip ci]"

          # theme, aligned with the profile's noir / deep-blue palette
          config_display: large
          config_timezone: Africa/Lome
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_habits: yes
          plugin_habits_charts_type: bars
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
