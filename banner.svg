<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abel Belei — Software Engineer, Togo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070C"/>
      <stop offset="0.55" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0E1A33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 150) scale(260)">
      <stop offset="0" stop-color="#3D7DFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3D7DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arcStroke" x1="760" y1="230" x2="1120" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D7DFF"/>
      <stop offset="1" stop-color="#8FC1FF"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#3D7DFF" fill-opacity="0.14"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <style>
    .eyebrow{font:600 13px/1 'JetBrains Mono',Consolas,monospace;letter-spacing:3px;fill:#6FA0FF;}
    .name{font:800 54px/1 'Segoe UI',Helvetica,Arial,sans-serif;fill:#F5F7FA;letter-spacing:0.5px;}
    .role{font:500 20px/1 'Segoe UI',Helvetica,Arial,sans-serif;fill:#AEB9CF;}
    .chip-text{font:600 12px/1 'JetBrains Mono',Consolas,monospace;fill:#DCE4F5;}
    .caption{font:500 11px/1 'JetBrains Mono',Consolas,monospace;letter-spacing:2px;fill:#5A6A8C;}
    .cursor{fill:#3D7DFF;}
    @keyframes draw{ to { stroke-dashoffset: 0; } }
    @keyframes pulse{ 0%,100%{ r:5; opacity:1;} 50%{ r:9; opacity:0.35;} }
    @keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
    @keyframes fadeUp{ 0%{opacity:0; transform:translateY(8px);} 12%{opacity:1; transform:translateY(0);} 88%{opacity:1;} 100%{opacity:0; transform:translateY(-8px);} }
    #role-1{ animation: fadeUp 9s ease-in-out infinite; }
    #role-2{ animation: fadeUp 9s ease-in-out infinite; animation-delay: 3s; }
    #role-3{ animation: fadeUp 9s ease-in-out infinite; animation-delay: 6s; }
    #role-1,#role-2,#role-3{ opacity:0; }
    .arcPath{ stroke-dasharray: 620; stroke-dashoffset: 620; animation: draw 2.6s ease-out forwards; }
    .ball{ animation: pulse 2.4s ease-in-out infinite; animation-delay: 2.6s; }
    .cursor{ animation: blink 1.1s steps(1) infinite; }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>

    <!-- faint court key arc, signature backdrop -->
    <circle cx="1010" cy="150" r="230" stroke="#3D7DFF" stroke-opacity="0.10" stroke-width="1.5"/>
    <circle cx="1010" cy="150" r="150" stroke="#3D7DFF" stroke-opacity="0.08" stroke-width="1.5"/>

    <!-- left text block -->
    <text x="64" y="78" class="eyebrow">SOFTWARE ENGINEER · TOGO 🇹🇬</text>
    <text x="62" y="146" class="name">ABEL BELEI</text>

    <g>
      <text id="role-1" x="64" y="182" class="role">Full-Stack Developer — Java · Spring Boot · React</text>
      <text id="role-2" x="64" y="182" class="role">Building for the web, mobile &amp; the cloud</text>
      <text id="role-3" x="64" y="182" class="role">Learning DevOps, one deploy at a time</text>
    </g>

    <!-- tag chips -->
    <g transform="translate(64,208)">
      <g>
        <rect width="60" height="26" rx="13" fill="#101B33" stroke="#22314F"/>
        <text x="14" y="17" class="chip-text">Java</text>
      </g>
      <g transform="translate(68,0)">
        <rect width="112" height="26" rx="13" fill="#101B33" stroke="#22314F"/>
        <text x="14" y="17" class="chip-text">Spring Boot</text>
      </g>
      <g transform="translate(188,0)">
        <rect width="72" height="26" rx="13" fill="#101B33" stroke="#22314F"/>
        <text x="14" y="17" class="chip-text">React</text>
      </g>
      <g transform="translate(268,0)">
        <rect width="86" height="26" rx="13" fill="#101B33" stroke="#22314F"/>
        <text x="14" y="17" class="chip-text">DevOps</text>
      </g>
    </g>

    <!-- signature: shot-arc → growth-line, drawn on load -->
    <path class="arcPath" d="M 760 232 C 840 232, 880 232, 920 190 C 955 154, 960 110, 1010 96 C 1055 84, 1090 92, 1122 70"
          stroke="url(#arcStroke)" stroke-width="3" stroke-linecap="round"/>
    <circle class="ball" cx="1122" cy="70" r="5" fill="#8FC1FF"/>
    <line x1="760" y1="232" x2="1140" y2="232" stroke="#22314F" stroke-width="1"/>
    <rect x="1128" y="63" width="8" height="14" class="cursor"/>

    <text x="760" y="256" class="caption">BUILD · SHIP · SCALE</text>
  </g>
</svg>
